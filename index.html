<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFDD09" />
    <meta
      name="description"
      content="Tokco brings vibrant sweetness and good vibes to life. Experience our interactive 3D donut universe, artisanal pastry art, and follow @tokco.in for the freshest drops."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TOKCO" />
    <meta property="og:title" content="TOKCO — Donut Worry, Be Happy | Official Website" />
    <meta
      property="og:description"
      content="Step into the playful 3D world of Tokco. Premium baked treats, vibrant vibes, and pure happiness."
    />
    <meta property="og:image" content="./tokco-social.jpg" />
    <meta property="og:image:alt" content="TOKCO brand logo on vibrant yellow backdrop" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TOKCO — Donut Worry, Be Happy" />
    <meta
      name="twitter:description"
      content="Explore the interactive 3D donut experience from TOKCO. Follow @tokco.in for the sweetest moments."
    />
    <meta name="twitter:image" content="./tokco-social.jpg" />

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preload" as="image" href="./tokco-logo.png" />

    <!-- Typography: Outfit (editorial display) & Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TOKCO",
        "url": "https://tokco.in/",
        "logo": "https://tokco.in/tokco-logo.png",
        "sameAs": [
          "https://www.instagram.com/tokco.in/"
        ],
        "description": "Tokco brings vibrant sweetness, playful energy, and premium artisanal donut-inspired joy."
      }
    </script>

    <title>TOKCO — Donut Worry, Be Happy | Official 3D Experience</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
